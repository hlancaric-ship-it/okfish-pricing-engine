<title>OKFISH — objednávky sklad</title>
<style>
  :root {
    --bg: #f5f5f5; --surface: #fff; --border: #e2e5e0;
    --text: #1a1a1a; --text-dim: #55605a; --text-faint: #8a938c;
    --brand: #88ba15; --brand-dark: #6d9611;
    --ok: #1a7f37; --ok-dim: #e3f5ea; --ok-bar: #3fb95f;
    --warn: #9a6700; --warn-dim: #fdf3d8; --warn-bar: #e0a72e;
    --crit: #cf222e; --crit-dim: #fbe6e5; --crit-bar: #e6474f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-variant-numeric: tabular-nums; }

  .topbar { background: linear-gradient(90deg, #ffffff 0%, var(--brand) 100%); padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
  .topbar img { height: 34px; display: block; }
  .topbar .title { color: #1a2e00; font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
  .topbar .title small { display: block; font-weight: 500; font-size: 12px; opacity: 0.9; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 24px 60px; }

  /* -- Súhrn hore: čo sa musí riešiť, jedným pohľadom -- */
  .summary-period { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); font-weight: 650; margin-bottom: 6px; }
  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .sum-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
  .sum-card .num { font-size: 24px; font-weight: 700; line-height: 1; }
  .sum-card .lbl { font-size: 12px; color: var(--text-faint); margin-top: 4px; }
  .sum-card.red .num { color: var(--crit); }
  .sum-card.yellow .num { color: var(--warn); }
  .sum-card.green .num { color: var(--ok); }

  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn {
    padding: 6px 13px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
    font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-dim);
  }
  .filter-btn.active { background: var(--text); color: #fff; border-color: var(--text); }

  .list { display: flex; flex-direction: column; gap: 6px; }

  .list-header {
    display: flex; align-items: center; gap: 10px; padding: 0 16px 8px;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); font-weight: 650;
  }
  .lh-code { width: 90px; }
  .lh-customer { width: 160px; }
  .lh-date { width: 110px; }
  .lh-spacer { flex: 1; }
  .lh-status { width: 190px; }
  .lh-summary { width: 140px; text-align: right; }
  .lh-price { width: 100px; text-align: right; }

  .order-row.is-resolved { opacity: 0.55; background: var(--bg) !important; border-color: var(--border) !important; }
  .order-row.is-resolved .row-code, .order-row.is-resolved .row-customer { text-decoration: line-through; }
  .resolve-badge {
    background: var(--text); color: #fff; padding: 3px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.03em;
  }
  .resolve-toggle {
    padding: 4px 9px; border-radius: 5px; border: 1px solid var(--text-faint); background: #fff; color: var(--text-dim);
    font-size: 12.5px; font-weight: 650; cursor: pointer; white-space: nowrap;
  }
  .resolve-toggle:hover { background: var(--surface-2, #eee); }
  .order-row {
    background: var(--surface); border: 1px solid var(--border); border-left: 4px solid transparent;
    border-radius: 8px; padding: 8px 12px;
  }
  .order-row.red { border-left-color: var(--crit-bar); background: var(--crit-dim); border-color: #f3bcbd; }
  .order-row.yellow { border-left-color: var(--warn-bar); background: var(--warn-dim); border-color: #f0dca3; }
  .order-row.green { border-left-color: var(--ok-bar); background: var(--ok-dim); border-color: #c3e8cf; }

  .row-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .row-code { font-weight: 700; font-size: 14.5px; }
  .row-customer { color: var(--text); font-weight: 700; font-size: 14.5px; text-transform: uppercase; }
  .row-date { color: var(--text-faint); font-size: 11.5px; }
  .row-spacer { flex: 1; }
  .row-summary { font-size: 12px; font-weight: 700; color: #fff; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .row-summary.red { background: var(--crit-bar); }
  .row-summary.yellow { background: var(--warn-bar); }
  .row-summary.green { background: var(--ok-bar); }
  .row-price { font-weight: 650; }
  .badge { padding: 2px 9px; border-radius: 5px; font-size: 11px; font-weight: 650; white-space: nowrap; }
  .badge.paid { background: var(--ok-dim); color: var(--ok); }
  .badge.unpaid { background: var(--crit-dim); color: var(--crit); }

  .row-detail { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }

  .item-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 2px 0; font-size: 13px; flex-wrap: wrap; }
  .item-name { color: var(--text-dim); flex: 1; }
  .item-right { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
  .item-code { color: var(--text-faint); font-size: 11.5px; width: 60px; display: inline-block; text-align: right; }
  .item-status { font-weight: 600; }
  .item-status.missing { color: var(--crit); }
  .item-status.unknown { color: var(--text-faint); }
  .all-ok { color: var(--ok); font-size: 13px; font-weight: 600; }

  .row-actions { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .note-input {
    flex: 1; min-width: 160px; font-family: inherit; font-size: 12.5px;
    padding: 5px 8px; border-radius: 5px; border: 1px solid var(--border); background: #fff; color: var(--text);
  }
  .action-row { display: flex; gap: 8px; margin-bottom: 16px; justify-content: flex-end; }
  .copy-all-codes {
    padding: 7px 14px; border-radius: 6px; border: 1px solid var(--brand-dark); background: var(--brand);
    color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .copy-all-codes:hover { background: var(--brand-dark); }
  .copy-all-codes.copied { background: var(--ok); border-color: var(--ok); }
  .export-excel {
    padding: 7px 14px; border-radius: 6px; border: 1px solid var(--brand-dark); background: var(--brand);
    color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .export-excel:hover { background: var(--brand-dark); }

  .copy-codes {
    padding: 4px 9px; border-radius: 5px; border: 1px solid var(--crit); background: #fff; color: var(--crit);
    font-size: 12.5px; font-weight: 650; cursor: pointer; white-space: nowrap;
  }
  .copy-codes:hover { background: var(--crit-dim); }
  .copy-codes.copied { background: var(--ok-dim); border-color: var(--ok); color: var(--ok); }

  .note-save, a.admin-link {
    padding: 4px 9px; border-radius: 5px; border: none;
    background: var(--brand); color: #fff; font-size: 12.5px; font-weight: 650; cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  .note-save:hover, a.admin-link:hover { background: var(--brand-dark); }
  .note-status { font-size: 12px; color: var(--text-faint); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-faint); }
  footer { text-align: center; font-size: 11.5px; color: var(--text-faint); margin-top: 26px; }
</style>

<div class="topbar">
  <img src="https://cdn.myshoptet.com/usr/www.okfish.sk/user/logos/logo-fish.png" alt="OKFISH">
  <div class="title">Objednávky — skladový prehľad<small>interný nástroj, nezdieľať</small></div>
</div>

<div class="wrap">
  <div class="summary-period">Prehľad za posledných 14 dní</div>
  <div class="summary" id="summary"></div>
  <div class="filters" id="filters"></div>
  <div class="action-row">
    <button class="copy-all-codes" id="copyAllCodes">Kopírovať VŠETKY chýbajúce kódy (spočítané spolu)</button>
    <button class="export-excel" id="exportExcel">📥 Exportovať do Excelu (.csv)</button>
  </div>
  <div class="list-header">
    <span class="lh-code">Objednávka</span>
    <span class="lh-customer">Zákazník</span>
    <span class="lh-date">Dátum</span>
    <span class="lh-spacer"></span>
    <span class="lh-status">Platba / sklad</span>
    <span class="lh-price">Cena</span>
  </div>
  <div id="content"><div class="empty-state">Načítám…</div></div>
  <footer>Aktualizuje sa každých 60 s</footer>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const TOKEN = params.get('token') || '';
  let currentFilter = 'all'; // 'all', 'action' (red+yellow), 'red', 'yellow', 'green'
  let lastData = null;

  function fmtMoney(v) {
    return new Intl.NumberFormat('sk-SK', { style: 'currency', currency: 'EUR' }).format(Number(v) || 0);
  }
  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('sk-SK') + ' ' + d.toLocaleTimeString('sk-SK', { hour: '2-digit', minute: '2-digit' });
  }
  function missingItems(o) {
    return (o.items || []).filter(i => i.inStock === null || i.inStock < i.ordered);
  }

  function renderSummary(orders) {
    const counts = { red: 0, yellow: 0, green: 0 };
    let actionValue = 0;
    orders.forEach(o => {
      counts[o.semaphore]++;
      if (o.semaphore !== 'green') actionValue += Number(o.priceWithVat) || 0;
    });
    const summary = document.getElementById('summary');
    summary.innerHTML =
      '<div class="sum-card red"><div class="num mono">' + counts.red + '</div><div class="lbl">nič skladom</div></div>' +
      '<div class="sum-card yellow"><div class="num mono">' + counts.yellow + '</div><div class="lbl">niečo chýba</div></div>' +
      '<div class="sum-card green"><div class="num mono">' + counts.green + '</div><div class="lbl">vše skladom</div></div>' +
      '<div class="sum-card"><div class="num mono">' + fmtMoney(actionValue) + '</div><div class="lbl">súčet cien objednávok, kde niečo chýba skladom</div></div>';
  }

  function renderFilters(orders) {
    const counts = { red: 0, yellow: 0, green: 0, resolved: 0 };
    orders.forEach(o => { counts[o.semaphore]++; if (o.resolved) counts.resolved++; });
    const activeCount = orders.filter(o => !o.resolved).length;
    const opts = [
      ['all', 'Aktívne (' + activeCount + ')'],
      ['red', 'Nič skladom (' + counts.red + ')'],
      ['yellow', 'Niečo chýba (' + counts.yellow + ')'],
      ['green', 'Vše skladom (' + counts.green + ')'],
      ['resolved', 'Vyriešené (' + counts.resolved + ')'],
    ];
    const filters = document.getElementById('filters');
    filters.innerHTML = opts.map(([key, label]) =>
      '<button class="filter-btn' + (currentFilter === key ? ' active' : '') + '" data-filter="' + key + '">' + label + '</button>'
    ).join('');
  }

  function render(data) {
    lastData = data;
    const content = document.getElementById('content');
    const draftNotes = {};
    content.querySelectorAll('.note-input').forEach((el) => {
      if (el.value) draftNotes[el.dataset.code] = el.value;
    });

    const orders = data.orders || [];
    renderSummary(orders);
    renderFilters(orders);

    if (orders.length === 0) {
      content.innerHTML = '<div class="empty-state">Žiadne otvorené objednávky za posledných 14 dní.</div>';
      return;
    }

    orders.sort((a, b) => new Date(b.creationTime).getTime() - new Date(a.creationTime).getTime());

    const filtered = orders.filter(o => {
      if (currentFilter === 'resolved') return !!o.resolved;
      if (o.resolved) return false; // vyriešené sa mimo záložky "Vyriešené" neukazujú
      if (currentFilter === 'all') return true;
      return o.semaphore === currentFilter;
    });

    if (filtered.length === 0) {
      content.innerHTML = '<div class="empty-state">✓ Nič v tejto kategórii — dobrá práca!</div>';
      return;
    }

    const rowSummaryLabel = { red: 'nič skladom', yellow: 'niečo chýba', green: 'PRIPRAVENÉ NA ODOSLANIE' };

    let html = '<div class="list">';
    for (const o of filtered) {
      const missing = missingItems(o);
      html += '<div class="order-row ' + o.semaphore + (o.resolved ? ' is-resolved' : '') + '" data-code="' + o.code + '">';
      html += '<div class="row-top">';
      html += '<span class="row-code mono">' + o.code + '</span>';
      html += '<span class="row-customer">' + o.customerName + '</span>';
      html += '<span class="row-date mono">' + fmtDate(o.creationTime) + '</span>';
      html += '<span class="row-spacer"></span>';
      if (o.resolved) html += '<span class="resolve-badge">✓ VYRIEŠENÉ</span>';
      html += '<span class="badge ' + (o.paid ? 'paid' : 'unpaid') + '">' + (o.paid ? 'Zaplatené' : 'Nezaplatené') + '</span>';
      // "Pripravené na odoslanie" má zmysel len keď je aj zaplatené -- sklad OK
      // ale nezaplatená objednávka (napr. zlyhaná platba kartou) sa NEODOSIELA,
      // bez ohľadu na sklad. Potvrdené živo: objednávka 2026000365 (Zlyhaná
      // platba kartou) sa nesprávne ukazovala ako "pripravené na odoslanie".
      const summaryText = missing.length > 0
        ? missing.length + '× ' + rowSummaryLabel[o.semaphore]
        : (o.semaphore === 'green' && !o.paid ? '✓ vše skladom (čaká na platbu)' : '✓ ' + rowSummaryLabel[o.semaphore]);
      html += '<span class="row-summary ' + o.semaphore + '">' + summaryText + '</span>';
      html += '<span class="row-price mono">' + fmtMoney(o.priceWithVat) + '</span>';
      html += '</div>';

      html += '<div class="row-detail">';
      if (missing.length === 0) {
        html += '<div class="all-ok">✓ všetko skladom, netreba nič objednávať</div>';
      } else {
        for (const item of missing) {
          const statusClass = item.inStock === null ? 'unknown' : 'missing';
          let statusText;
          if (item.inStock === null) {
            statusText = 'neznámy sklad';
          } else {
            const shortBy = item.ordered - item.inStock;
            statusText = shortBy > 0 ? ('chýba ' + shortBy + ' ks — treba objednať') : ('skladom len ' + item.inStock + ' ks');
          }
          const codeLabel = item.code ? '<span class="item-code mono">[' + item.code + ']</span>' : '<span class="item-code"></span>';
          html += '<div class="item-row"><span class="item-name">' + item.name + '</span><span class="item-right">' + codeLabel + '<span class="item-status ' + statusClass + '">' + statusText + '</span></span></div>';
        }
      }
      html += '<div class="row-actions">';
      if (missing.length > 0) {
        const codesToCopy = missing.filter(i => i.code).map(i => {
          const qty = i.inStock === null ? i.ordered : (i.ordered - i.inStock);
          return i.code + ' x' + qty;
        }).join(', ');
        html += '<button class="copy-codes" data-codes="' + codesToCopy + '">Kopírovať chýbajúce kódy</button>';
      }
      html += '<textarea class="note-input" rows="1" data-code="' + o.code + '" placeholder="Poznámka e-shopu…"></textarea>';
      html += '<button class="note-save" data-code="' + o.code + '">Uložiť poznámku</button>';
      html += '<span class="note-status" data-code="' + o.code + '"></span>';
      html += '<button class="resolve-toggle" data-code="' + o.code + '" data-resolved="' + (o.resolved ? '1' : '0') + '">' + (o.resolved ? '↺ Vrátiť medzi aktívne' : '✓ Označiť ako vyriešené') + '</button>';
      html += '<a class="admin-link" href="' + o.adminUrl + '" target="_blank">Otvoriť →</a>';
      html += '</div>';
      html += '</div>'; // row-detail
      html += '</div>'; // order-row
    }
    html += '</div>';
    content.innerHTML = html;
    content.querySelectorAll('.note-input').forEach((el) => {
      if (draftNotes[el.dataset.code]) el.value = draftNotes[el.dataset.code];
    });
  }

  function computeMissingTotals() {
    // code -> { qty, name }, sčítané naprieč VŠETKÝMI otvorenými objednávkami
    // (nezáleží na aktuálnom filtri v zobrazení).
    const totals = {};
    (lastData?.orders || []).forEach(o => {
      missingItems(o).forEach(i => {
        if (!i.code) return;
        const qty = i.inStock === null ? i.ordered : (i.ordered - i.inStock);
        if (!totals[i.code]) totals[i.code] = { qty: 0, name: i.name };
        totals[i.code].qty += qty;
      });
    });
    return totals;
  }

  document.getElementById('copyAllCodes').addEventListener('click', async (e) => {
    if (!lastData) return;
    const totals = computeMissingTotals();
    const text = Object.entries(totals).map(([code, v]) => code + ' x' + v.qty).join(', ');
    const btn = e.currentTarget;
    try {
      await navigator.clipboard.writeText(text);
      const original = btn.textContent;
      btn.textContent = '✓ Skopírované (' + Object.keys(totals).length + ' kódov)';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 2200);
    } catch (err) {
      btn.textContent = 'chyba kopírovania';
    }
  });

  document.getElementById('exportExcel').addEventListener('click', () => {
    if (!lastData) return;
    const totals = computeMissingTotals();
    const rows = [['Kód', 'Názov produktu', 'Počet ks na objednanie']];
    Object.entries(totals).forEach(([code, v]) => rows.push([code, v.name, v.qty]));

    const csv = rows.map(row =>
      row.map(cell => {
        const s = String(cell);
        return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(';')
    ).join('\r\n');

    // BOM pre správnu diakritiku pri otvorení v Exceli
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const today = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = 'okfish-chybajuce-produkty-' + today + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('filters').addEventListener('click', (e) => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    currentFilter = btn.dataset.filter;
    if (lastData) render(lastData);
  });

  document.getElementById('content').addEventListener('click', async (e) => {
    if (e.target.classList.contains('copy-codes')) {
      const codes = e.target.dataset.codes;
      try {
        await navigator.clipboard.writeText(codes);
        const original = e.target.textContent;
        e.target.textContent = '✓ Skopírované';
        e.target.classList.add('copied');
        setTimeout(() => { e.target.textContent = original; e.target.classList.remove('copied'); }, 1800);
      } catch (err) {
        e.target.textContent = 'chyba kopírovania';
      }
      return;
    }

    if (e.target.classList.contains('resolve-toggle')) {
      const code = e.target.dataset.code;
      const newResolved = e.target.dataset.resolved !== '1';
      e.target.disabled = true;
      try {
        await fetch('/v1/order-resolved?token=' + encodeURIComponent(TOKEN), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, resolved: newResolved }),
        });
        await poll(); // okamžite prekresliť podľa nového stavu
      } catch (err) {
        e.target.disabled = false;
      }
      return;
    }

    if (!e.target.classList.contains('note-save')) return;
    const code = e.target.dataset.code;
    const textarea = document.querySelector('.note-input[data-code="' + code + '"]');
    const status = document.querySelector('.note-status[data-code="' + code + '"]');
    const note = textarea.value;
    e.target.disabled = true;
    status.textContent = 'ukladám…';
    try {
      const res = await fetch('/v1/order-note?token=' + encodeURIComponent(TOKEN), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, note }),
      });
      const data = await res.json();
      status.textContent = res.ok ? '✓ uložené' : ('chyba: ' + (data.error || res.status));
    } catch (err) {
      status.textContent = 'chyba spojenia';
    }
    e.target.disabled = false;
  });

  async function poll() {
    try {
      const res = await fetch('/v1/orders-status', { headers: { Authorization: 'Bearer ' + TOKEN }, cache: 'no-store' });
      const data = await res.json();
      render(data);
    } catch (e) {
      document.getElementById('content').innerHTML = '<div class="empty-state">Chyba spojenia.</div>';
    }
  }

  poll();
  setInterval(poll, 60000);
</script>
