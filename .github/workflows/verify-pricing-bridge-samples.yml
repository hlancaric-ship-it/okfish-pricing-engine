name: Verify pricing-bridge fix on sample products (fast, no full sync)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Verify samples
        env:
          SHOPTET_PRIVATE_API_TOKEN: ${{ secrets.SHOPTET_PRIVATE_API_TOKEN }}
          MASTER_FEED_URL: ${{ secrets.MASTER_FEED_URL }}
        run: npx tsx scripts/verify-pricing-bridge-samples.ts
