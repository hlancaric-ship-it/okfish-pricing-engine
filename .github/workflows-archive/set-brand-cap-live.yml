name: Set brand max-discount cap live (one-off)

on:
  workflow_dispatch:
    inputs:
      brand:
        description: 'Přesný název značky (manufacturer)'
        required: true
      percent:
        description: 'Maximální povolená sleva v %'
        required: true
      live:
        description: 'Ostrý zápis? (jinak dry-run)'
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - working-directory: cloudflare-worker
        run: npm ci
      - name: Set brand cap
        working-directory: cloudflare-worker
        env:
          MASTER_FEED_URL: ${{ secrets.MASTER_FEED_URL }}
          SHOPTET_PRIVATE_API_TOKEN: ${{ secrets.SHOPTET_PRIVATE_API_TOKEN }}
          BRAND: ${{ github.event.inputs.brand }}
          PERCENT: ${{ github.event.inputs.percent }}
        run: |
          if [ "${{ github.event.inputs.live }}" = "true" ]; then
            npx tsx src/cli/set-brand-cap-live.ts --live
          else
            npx tsx src/cli/set-brand-cap-live.ts
          fi
