name: Set stockout behavior by price

on:
  schedule:
    # Denně v 5:00 UTC — nové produkty s "Nedostupné" se srovnají podle ceny
    # (>=100 € -> "Na dotaz", <100 € -> zůstává "Nedostupné") bez nutnosti
    # ručního zásahu. Zapnuto 2026-08-05 na žádost klienta.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      live:
        description: 'Ostrý zápis? (jinak dry-run) — ignorováno u plánovaného běhu, ten je vždy ostrý'
        type: boolean
        default: false

# Ochrana proti souběžnému běhu s hlavním cenovým syncem (obě sahají na stejné produkty).
concurrency:
  group: shoptet-sync-job
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Příprava Node.js prostředí
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalace závislostí (root)
        run: npm ci

      - name: Instalace závislostí (cloudflare-worker)
        working-directory: cloudflare-worker
        run: npm ci

      - name: Nastavení stockout chování podle ceny
        working-directory: cloudflare-worker
        env:
          MASTER_FEED_URL: ${{ secrets.MASTER_FEED_URL }}
          SHOPTET_PRIVATE_API_TOKEN: ${{ secrets.SHOPTET_PRIVATE_API_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.live }}" = "true" ]; then
            npx tsx src/cli/set-stockout-behavior-by-price.ts --live
          else
            npx tsx src/cli/set-stockout-behavior-by-price.ts
          fi
