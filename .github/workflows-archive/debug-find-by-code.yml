name: Debug find product by code (one-off)

on:
  workflow_dispatch:
    inputs:
      code:
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - working-directory: cloudflare-worker
        run: npm ci
      - working-directory: cloudflare-worker
        env:
          MASTER_FEED_URL: ${{ secrets.MASTER_FEED_URL }}
          CODE: ${{ github.event.inputs.code }}
        run: npx tsx src/cli/debug-find-by-code.ts
