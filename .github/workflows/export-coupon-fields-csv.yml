name: Export coupon fields CSV (for manual Shoptet import)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - working-directory: cloudflare-worker
        run: npm ci
      - name: Export coupon fields CSV
        working-directory: cloudflare-worker
        env:
          MASTER_FEED_URL: ${{ secrets.MASTER_FEED_URL }}
        run: npx tsx src/cli/export-coupon-fields-csv.ts
      - name: Upload CSV as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coupon_fields_import
          path: coupon_fields_import.csv
          retention-days: 3
