name: Sync GUEST coupon cap from ZR4

on:
  # ZASTAVENO 2026-08-05 — automatizace byla CHYBA. Tenhle skript zapisuje
  # do pricelistu 1 (GUEST), jehož minPriceRatio je TOTOŽNÉ pole s
  # "Maximální povolená sleva" na kartě produktu. Skript ale nezapisuje
  # skutečný strop — zapisuje ZR4 KUPÓNOVÝ PROSTOR (kolik ještě smí kupón
  # strhnout), což je koncepčně jiné číslo. Při hromadném běhu (14 606
  # produktů, 2×) to přepsalo reálně nastavené stropy vypočítanými
  # hodnotami napříč celým katalogem. NEZAPÍNAT znovu, dokud se skript
  # nepřepracuje tak, aby dokázal rozlišit "žádný vlastní strop nastaven"
  # od "strop je záměrně 0".
  workflow_dispatch:
    inputs:
      live:
        description: 'Ostrý zápis? (jinak dry-run) — ignorováno u plánovaného běhu, ten je vždy ostrý'
        type: boolean
        default: false

concurrency:
  group: sync-guest-coupon-cap
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - working-directory: cloudflare-worker
        run: npm ci
      - name: Sync GUEST coupon cap
        working-directory: cloudflare-worker
        env:
          SHOPTET_PRIVATE_API_TOKEN: ${{ secrets.SHOPTET_PRIVATE_API_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.live }}" = "true" ]; then
            npx tsx src/cli/sync-guest-coupon-cap-live.ts --live
          else
            npx tsx src/cli/sync-guest-coupon-cap-live.ts
          fi
