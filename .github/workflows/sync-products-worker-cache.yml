name: Sync products to Worker cache (frontend discount badges)

on:
  schedule:
    # Automatizováno 2026-08-05 na žádost klienta — posunuto o 5 minut proti
    # hlavnímu sync.yml (*/15), aby vždy běželo těsně PO přepočtu cen, ne
    # souběžně s ním. Bezpečné automatizovat: nesahá na Shoptet vůbec, jen
    # čte veřejný feed a píše do Worker KV cache přes jeho vlastní import
    # API — nemůže ovlivnit produkční ceny/kupóny ani feed generation.
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - working-directory: cloudflare-worker
        run: npm ci
      - name: Sync products (Worker product-discount cache only — no pricing/coupon writes)
        working-directory: cloudflare-worker
        env:
          MASTER_FEED_URL: ${{ secrets.MASTER_FEED_URL }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_WORKER_TOKEN: ${{ secrets.CF_WORKER_TOKEN }}
        run: npm run sync-products
