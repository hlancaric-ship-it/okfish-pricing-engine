name: Coupon Fields Sync (hodinově)

on:
  schedule:
    # Zrychleno 2026-08-05 (na žádost klienta) z 2×/den na hodinovou
    # frekvenci — kupónová eligibilita (vč. GUEST) se propíše mnohem
    # rychleji po nastavení nové akční ceny/stropu na produktu. Diff-aware
    # zápis + 30% bezpečnostní pojistka zůstávají beze změny.
    #
    # Běží nezávisle na hlavní cenové synchronizaci (sync.yml) — jiné pole
    # (sales.discountCoupon/minPriceRatio), jiný zápis, žádné sdílené kroky.
    #
    # Znovu zapnuto 2026-08-03 po opravě CouponSalesWriter (viz commit
    # "fix: critical — CouponSalesWriter no longer writes to pricelist ID 1") —
    # GUEST tier zápis do pricelistu 1 ("Hlavný cenník") se teď tvrdě odmítá,
    # takže už nemůže přepsat skutečný strop max. slevy na produktu.
    - cron: '15 * * * *'
  workflow_dispatch: # Možnost manuálního spuštění přes UI

concurrency:
  group: coupon-fields-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Práva pro commitnutí aktualizovaného coupon-state.json zpět do repozitáře a
    # pro vytvoření issue při selhání (notifikace).
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Příprava Node.js prostředí
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalace závislostí (root)
        run: npm ci

      - name: Instalace závislostí (cloudflare-worker)
        working-directory: cloudflare-worker
        run: npm ci

      - name: Diff-aware zápis coupon fields (jen změny)
        id: sync_run
        working-directory: cloudflare-worker
        env:
          MASTER_FEED_URL: ${{ secrets.MASTER_FEED_URL }}
          SHOPTET_PRIVATE_API_TOKEN: ${{ secrets.SHOPTET_PRIVATE_API_TOKEN }}
        run: |
          set -o pipefail
          npm run sync-coupon-fields-diff-live | tee coupon-sync.log

      - name: Sladění s remote před commitem (jiné cronové běhy mohly mezitím pushnout)
        if: success()
        run: git pull --rebase --autostash origin main

      - name: Uložení coupon-state.json do repozitáře
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: aktualizace coupon-state.json [skip ci]"
          file_pattern: cloudflare-worker/coupon-state.json

      - name: Uložení logu v případě chyby
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coupon-sync-error-log
          path: cloudflare-worker/coupon-sync.log
          retention-days: 7

      - name: Notifikace při selhání (GitHub Issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🔴 Selhala coupon fields synchronizace (coupon-fields.yml)";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Workflow **coupon-fields.yml** selhal ${new Date().toISOString()}.\n\nDetail běhu: ${runUrl}\n\nLog je uložený jako artifact \`coupon-sync-error-log\` u tohoto běhu.\n\nČasté příčiny: pojistka proti velkému diffu (>30 % katalogu), rozjetá validace ceníkové mapy, nebo useknutý master feed — viz log.`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-failure'
            });
            const existing = issues.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['sync-failure'],
                assignees: ['hlancaric-ship-it']
              });
            }
