name: Debug find product (one-off)

on:
  workflow_dispatch:
    inputs:
      needle:
        description: 'Substring hledaný v názvu produktu'
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - working-directory: cloudflare-worker
        run: npm ci
      - working-directory: cloudflare-worker
        env:
          MASTER_FEED_URL: ${{ secrets.MASTER_FEED_URL }}
          NEEDLE: ${{ github.event.inputs.needle }}
        run: npx tsx src/cli/debug-find-product.ts
