name: Coupon fields sync — forced live write (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - working-directory: cloudflare-worker
        run: npm ci
      - name: Forced live write (bypasses the >30% diff safety fuse)
        working-directory: cloudflare-worker
        env:
          MASTER_FEED_URL: ${{ secrets.MASTER_FEED_URL }}
          SHOPTET_PRIVATE_API_TOKEN: ${{ secrets.SHOPTET_PRIVATE_API_TOKEN }}
        run: npx tsx src/cli/sync-coupon-fields-diff.ts --live --force
      - name: Uložení coupon-state.json do repozitáře
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: aktualizace coupon-state.json (forced catch-up) [skip ci]"
          file_pattern: cloudflare-worker/coupon-state.json
