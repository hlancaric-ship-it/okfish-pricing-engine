name: Coupon Integrity Reconciliation (Stage 5)

# Stage 5 validace (docs/CORE_LOGIC_AND_VALIDATION.md §3.5), aplikovaná na
# kupónový pipeline per INC-011 (2026-08-13) -- nezávisle na tom, jestli
# nějaký webhook/write skript hlásí SUCCESS, znovu spočítá computeCouponWrites()
# (stejná produkční funkce), a porovná to s tím, co Shoptet skutečně má na
# discountCoupon/minPriceRatio napříč všemi 10 ZR tiery + GUEST. Zavedeno po
# zjištění, že sync-coupon-fields-single-product.ts běží jen na webhook, který
# se pro nové/edited produkty spolehlivě nespouští, a všechny plošné/scheduled
# fallbacky (coupon-fields.yml a příbuzné) byly archivovány 2026-08-12 beze
# stopy náhrady.

on:
  schedule:
    # Mimo špičku, staggered vůči price reconciliation (03:00) a hlavnímu
    # syncu (každých 15 min). ZVÁŽENO 2026-08-15 zrychlit po nálezu ZR20/
    # ZR25 lock-porušení, ale Jan se rozhodl NECHAT denní frekvenci --
    # rychlá detekce nových/změněných produktů teď řeší samostatná
    # okamžitá verifikace přímo v zápisové cestě (coupon-sales-writer.ts),
    # ne tohle plošné kolo. Tenhle plný katalogový sken zůstává jako
    # pomalejší, širší pojistka proti tiché logické chybě, co postihne
    # i produkty, které se vůbec nezměnily. Hodnota mismatche potřebuje
    # přetrvat 2 po sobě jdoucí běhy, než zaalertuje (viz
    # reconcile-coupon-drift.ts), takže denní frekvence stačí.
    - cron: '30 3 * * *'
  workflow_dispatch: # Možnost manuálního spuštění přes UI

concurrency:
  group: coupon-integrity-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Příprava Node.js prostředí
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalace závislostí
        run: npm ci

      - name: Spuštění kupónové reconciliace (read-only, nic nezapisuje do Shoptetu)
        id: reconcile_run
        env:
          SHOPTET_PRIVATE_API_TOKEN: ${{ secrets.SHOPTET_PRIVATE_API_TOKEN }}
          MASTER_FEED_URL: ${{ secrets.MASTER_FEED_URL }}
        run: |
          set -o pipefail
          npx tsx cloudflare-worker/src/cli/reconcile-coupon-drift.ts | tee coupon-reconciliation.log

      # .coupon_reconciliation_state.json se commitne VŽDY (i při selhání
      # výše) -- potřebujeme si pamatovat, co bylo "poprvé spatřeno dnes", i
      # když tenhle běh skončil s alertem. Jinak by debounce logika (2 po
      # sobě jdoucí běhy) nikdy nefungovala pro věci, co ALERT vyvolaly.
      - name: Sladění s remote před commitem
        if: always()
        run: |
          git fetch origin main
          git merge -X ours origin/main --no-edit || {
            git checkout --ours .coupon_reconciliation_state.json 2>/dev/null || true
            git add .coupon_reconciliation_state.json
            git commit --no-edit || true
          }

      - name: Uložení stavu kupónové reconciliace do repozitáře
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: aktualizace stavu coupon integrity reconciliace [skip ci]"
          file_pattern: .coupon_reconciliation_state.json

      - name: Uložení logu v případě selhání
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coupon-reconciliation-log
          path: coupon-reconciliation.log
          retention-days: 30

      - name: Notifikace při nalezeném driftu / selhání (GitHub Issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🟠 Coupon Integrity: nalezen kupónový drift nebo selhal self-check (reconcile-coupon-drift.yml)";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Kupónová reconciliace ${new Date().toISOString()} našla neshodu mezi očekávanými a skutečnými kupónovými poli (discountCoupon/minPriceRatio), nebo selhal její vlastní self-check -- viz Stage 5 v CORE_LOGIC_AND_VALIDATION.md a INC-011 v INCIDENTS.md.\n\nDetail běhu: ${runUrl}\n\nLog je uložený jako artifact \`coupon-reconciliation-log\` u tohoto běhu. Formát alertu v logu: "Kupón měl být X. Shoptet má Y. Produkt nebyl synchronizován."`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'coupon-integrity'
            });
            const existing = issues.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['coupon-integrity'],
                assignees: ['hlancaric-ship-it']
              });
            }
