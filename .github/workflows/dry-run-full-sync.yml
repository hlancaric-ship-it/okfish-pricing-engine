name: Dry-run full sync.yml (verify before re-enabling)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Dry-run sync
        env:
          SHOPTET_PRIVATE_API_TOKEN: ${{ secrets.SHOPTET_PRIVATE_API_TOKEN }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_WORKER_TOKEN: ${{ secrets.CF_WORKER_TOKEN }}
        run: |
          set -o pipefail
          npx tsx scripts/run-dry-sync.ts | tee dry-sync.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-sync-log
          path: dry-sync.log
          retention-days: 7
