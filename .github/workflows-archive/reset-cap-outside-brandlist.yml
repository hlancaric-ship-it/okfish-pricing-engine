name: Reset discount cap outside brand list (incident recovery, one-off)

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Ostrý zápis? (jinak dry-run)'
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - working-directory: cloudflare-worker
        run: npm ci
      - name: Reset cap outside brand list
        working-directory: cloudflare-worker
        env:
          MASTER_FEED_URL: ${{ secrets.MASTER_FEED_URL }}
          SHOPTET_PRIVATE_API_TOKEN: ${{ secrets.SHOPTET_PRIVATE_API_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.live }}" = "true" ]; then
            npx tsx src/cli/reset-cap-outside-brandlist.ts --live
          else
            npx tsx src/cli/reset-cap-outside-brandlist.ts
          fi
