name: Shoptet Pricing Engine Sync

on:
  schedule:
    # Zpomaleno zpátky na hodinovou frekvenci 2026-08-21 (na žádost klienta,
    # kvůli nákladům na GitHub Actions metered usage) -- 15minutová frekvence
    # zavedená 2026-08-05 čtyřnásobila počet běhů/měsíc. Webhook
    # (repository_dispatch, viz níže) zůstává jako rychlá cesta pro skutečné
    # order/product změny -- hodinový cron je jen záložní síť.
    - cron: '0 * * * *'
  workflow_dispatch: # Možnost manuálního spuštění přes UI
  repository_dispatch:
    # Spouští Worker (POST /v1/webhook/shoptet) během pár sekund po order:create/
    # order:update v Shoptetu -- cron výše zůstává jako záložní síť pro případ, že by
    # webhook selhal nebo Shoptet vyčerpal svých 3 retry pokusy.
    types: [shoptet-webhook]

# Ochrana proti souběžnému běhu (pokud už synchronizace běží, nová počká nebo se nespustí paralelně)
concurrency:
  group: shoptet-sync-job
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    # Práva pro commitnutí .sync_state.json zpět do repozitáře a pro vytvoření
    # issue při selhání (notifikace).
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Příprava Node.js prostředí
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalace závislostí
        run: npm ci

      - name: Spuštění Inkrementální Synchronizace
        id: sync_run
        env:
          SHOPTET_PRIVATE_API_TOKEN: ${{ secrets.SHOPTET_PRIVATE_API_TOKEN }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_WORKER_TOKEN: ${{ secrets.CF_WORKER_TOKEN }}
          MASTER_FEED_URL: ${{ secrets.MASTER_FEED_URL }}
        run: |
          set -o pipefail
          npx tsx scripts/run-real-sync.ts | tee sync-execution.log

      # Samostatná pipeline (KV data pro /v1/product-discount, na kterých stojí
      # katalog/košík/detail cenové badge) -- dřív se spouštěla jen ručně přes
      # `npm run sync-products` a nikdo si nevšiml, že se dávno nespustila, dokud
      # se badge úplně nepřestaly zobrazovat (2026-08-06, potvrzeno živě). Teď běží
      # automaticky při každém triggeru (cron i webhook), aby nová/změněná cena
      # produktu vždy skončila v KV bez ručního zásahu.
      - name: Synchronizace produktových dat pro frontend badge (sync-products)
        if: success()
        working-directory: cloudflare-worker
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_WORKER_TOKEN: ${{ secrets.CF_WORKER_TOKEN }}
          MASTER_FEED_URL: ${{ secrets.MASTER_FEED_URL }}
        run: npx tsx src/cli/sync-products.ts

      - name: Sladění s remote před commitem (jiné cronové běhy mohly mezitím pushnout)
        if: success()
        # Přepsáno 2026-08-06 (podruhé týž den): `git pull --rebase` s timeoutem
        # sice zastaví nekonečné visení, ale při přerušení uprostřed rebase nechá
        # repo v nevyřešeném konfliktním stavu ("you need to resolve your current
        # index first") -- a TEN pak shodí hned následující krok (git-auto-commit)
        # v tom samém běhu. Potvrzeno živě: 2 reálné běhy dnes takhle selhaly pod
        # náhlou vlnou webhooků (víc repository_dispatch běhů rychle za sebou).
        # Fix: fetch + merge se strategií "ours" na konfliktní soubor -- nikdy
        # nenechá index v nevyřešeném stavu, protože konflikt řeší tím, že vždycky
        # vezme AKTUÁLNÍ (tímto během právě spočítanou) verzi .sync_state.json,
        # ne že by čekal na ruční zásah. Žádná ztráta dat: .sync_state.json je jen
        # kontrolní časové razítko, i kdyby "prohrálo" proti starší hodnotě z
        # jiného běhu, příští sync jen projde o něco širší okno (neškodné,
        # idempotentní zápisy).
        timeout-minutes: 3
        run: |
          git fetch origin main
          git merge -X ours origin/main --no-edit || {
            echo "Merge selhal i s -X ours, vynucuji lokální verzi .sync_state.json"
            git checkout --ours .sync_state.json 2>/dev/null || true
            git add .sync_state.json
            git commit --no-edit || true
          }

      - name: Uložení stavu synchronizace (.sync_state.json) do repozitáře
        if: success() # Uloží stav pouze v případě, že synchronizace neskončila chybou
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: aktualizace času poslední synchronizace [skip ci]"
          file_pattern: .sync_state.json force-sync-products.json

      # ZMĚNĚNO 2026-09-04: dřív běželo jen na webhook product:create/product:update
      # (github.event_name == 'repository_dispatch'), který je dokumentovaně
      # nespolehlivý (CORE_LOGIC_AND_VALIDATION.md §3.6) -- Shoptet ho nemusí
      # poslat vůbec, zvlášť při hromadném importu více produktů najednou. Hodinový
      # schedule cron tuhle podmínku nikdy nesplňoval (event_name je 'schedule', ne
      # 'repository_dispatch'), takže kupónová pole neměla ŽÁDNOU zálohovanou cestu
      # -- na rozdíl od cen, kde run-real-sync.ts běží při KAŽDÉM triggeru. Zjištěno
      # 2026-09-04: SKU 38352/38354 chyběly kupónové zápisy na všech 10 tierech,
      # protože zjevně přišly bez funkčního webhooku a žádný pravidelný běh je
      # nikdy nezachytil (coupon-fields.yml, plošný scheduled fallback, byl
      # archivován 2026-08-12 bez náhrady).
      #
      # Řešení: sjednoceno s cenovou architekturou. sync-coupon-fields-diff.ts běží
      # při KAŽDÉM úspěšném triggeru (cron i webhook), diff-aware proti
      # coupon-state.json (jen změny se zapisují), s vlastními Stage 2 pojistkami
      # (MIN_EXPECTED_PRODUCTS=5000, MAX_CHANGE_RATIO=30% -- viz
      # CORE_LOGIC_AND_VALIDATION.md §3.2). continue-on-error zachováno, aby chyba
      # tady nemohla zpětně shodit už úspěšně dokončené kroky výše.
      - name: Živý diff-aware zápis kupónových polí (fallback pro celý katalog, ne jen webhook)
        if: success()
        continue-on-error: true
        working-directory: cloudflare-worker
        env:
          SHOPTET_PRIVATE_API_TOKEN: ${{ secrets.SHOPTET_PRIVATE_API_TOKEN }}
          MASTER_FEED_URL: ${{ secrets.MASTER_FEED_URL }}
        run: npx tsx src/cli/sync-coupon-fields-diff.ts --live

      # Bez tohohle by cloudflare-worker/coupon-state.json zůstal zamrzlý na
      # posledním stavu z archivovaného coupon-fields.yml (12.8.) a diff by se
      # navždy počítal proti čím dál zastaralejšímu základu -- stejný vzor jako
      # .sync_state.json o pár kroků výš. continue-on-error na předchozím kroku
      # znamená, že tenhle běží i po jeho neúspěchu; commit se ale reálně
      # nezmění, pokud diff skript sám nedoběhl do zápisu stavu.
      - name: Uložení coupon-state.json do repozitáře
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: aktualizace coupon-state.json [skip ci]"
          file_pattern: cloudflare-worker/coupon-state.json

      - name: Uložení logu v případě chyby
        if: failure() # Tento krok se provede pouze při selhání některého z předchozích kroků
        uses: actions/upload-artifact@v4
        with:
          name: sync-error-log
          path: sync-execution.log
          retention-days: 7

      - name: Notifikace při selhání (GitHub Issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🔴 Selhala hodinová synchronizace (sync.yml)";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Workflow **sync.yml** selhal ${new Date().toISOString()}.\n\nDetail běhu: ${runUrl}\n\nLog je uložený jako artifact \`sync-error-log\` u tohoto běhu.`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-failure'
            });
            const existing = issues.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['sync-failure'],
                assignees: ['hlancaric-ship-it']
              });
            }
