name: Export "clear GUEST cap only" CSV for no-cap brands

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - working-directory: cloudflare-worker
        run: npm ci
      - name: Export clear-GUEST-cap-only CSV
        working-directory: cloudflare-worker
        env:
          MASTER_FEED_URL: ${{ secrets.MASTER_FEED_URL }}
        run: npx tsx src/cli/export-clear-guest-cap-only-csv.ts
      - name: Upload CSV as artifact
        uses: actions/upload-artifact@v4
        with:
          name: clear_guest_cap_only
          path: clear_guest_cap_only.csv
          retention-days: 7
