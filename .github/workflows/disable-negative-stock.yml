name: Disable negative stock ordering (one-off)

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Ostrý zápis? (jinak dry-run — jen spočítá a vypíše, co by se změnilo)'
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Příprava Node.js prostředí
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalace závislostí (root)
        run: npm ci

      - name: Instalace závislostí (cloudflare-worker)
        working-directory: cloudflare-worker
        run: npm ci

      - name: Vypnutí negativeStockAllowed
        working-directory: cloudflare-worker
        env:
          MASTER_FEED_URL: ${{ secrets.MASTER_FEED_URL }}
          SHOPTET_PRIVATE_API_TOKEN: ${{ secrets.SHOPTET_PRIVATE_API_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.live }}" = "true" ]; then
            npx tsx src/cli/disable-negative-stock.ts --live
          else
            npx tsx src/cli/disable-negative-stock.ts
          fi
