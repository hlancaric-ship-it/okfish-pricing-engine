name: Backup ALL pricelists (full snapshot)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - working-directory: cloudflare-worker
        run: npm ci
      - name: Backup all pricelists
        working-directory: cloudflare-worker
        env:
          SHOPTET_PRIVATE_API_TOKEN: ${{ secrets.SHOPTET_PRIVATE_API_TOKEN }}
        run: npx tsx src/cli/backup-all-pricelists.ts
      - name: Upload snapshot as artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-pricelist-backup
          path: cloudflare-worker/.snapshots/*.json
          retention-days: 90
          include-hidden-files: true
