<title>OKFISH — objednávky sklad</title>
<style>
  :root {
    --bg: #f5f5f5; --surface: #fff; --border: #e2e5e0;
    --text: #1a1a1a; --text-dim: #55605a; --text-faint: #8a938c;
    --brand: #88ba15; --brand-dark: #6d9611;
    --ok: #1a7f37; --ok-dim: #e3f5ea; --ok-bar: #3fb95f;
    --warn: #9a6700; --warn-dim: #fdf3d8; --warn-bar: #e0a72e;
    --crit: #cf222e; --crit-dim: #fbe6e5; --crit-bar: #e6474f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-variant-numeric: tabular-nums; }

  .topbar { background: linear-gradient(90deg, #ffffff 0%, var(--brand) 100%); padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
  .topbar img { height: 34px; display: block; }
  .topbar .title { color: #1a2e00; font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
  .topbar .title small { display: block; font-weight: 500; font-size: 12px; opacity: 0.9; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 24px 60px; }

  /* -- Súhrn hore: čo sa musí riešiť, jedným pohľadom -- */
  .summary-period { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); font-weight: 650; margin-bottom: 6px; }
  .summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
  .sum-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
  .sum-card .num { font-size: 24px; font-weight: 700; line-height: 1; }
  .sum-card .lbl { font-size: 12px; color: var(--text-faint); margin-top: 4px; }

  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn {
    padding: 6px 13px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
    font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-dim);
  }
  .filter-btn.active { background: var(--text); color: #fff; border-color: var(--text); }

  .list { display: flex; flex-direction: column; gap: 6px; }

  .list-header {
    display: flex; align-items: center; gap: 10px; padding: 0 16px 8px;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); font-weight: 650;
  }
  .lh-code { width: 90px; }
  .lh-customer { width: 160px; }
  .lh-date { width: 110px; }
  .lh-spacer { flex: 1; }
  .lh-status { width: 190px; }
  .lh-summary { width: 140px; text-align: right; }
  .lh-price { width: 100px; text-align: right; }

  .order-row.is-resolved { opacity: 0.55; background: var(--bg) !important; border-color: var(--border) !important; }
  .order-row.is-resolved .row-code, .order-row.is-resolved .row-customer { text-decoration: line-through; }
  .resolve-badge {
    background: var(--text); color: #fff; padding: 3px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.03em;
  }
  .resolve-toggle {
    padding: 4px 9px; border-radius: 5px; border: 1px solid var(--text-faint); background: #fff; color: var(--text-dim);
    font-size: 12.5px; font-weight: 650; cursor: pointer; white-space: nowrap;
  }
  .resolve-toggle:hover { background: var(--surface-2, #eee); }
  .order-row {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px;
  }

  .row-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .row-code { font-weight: 700; font-size: 14.5px; }
  .row-customer { color: var(--text); font-weight: 700; font-size: 14.5px; text-transform: uppercase; }
  .row-date { color: var(--text-faint); font-size: 11.5px; }
  .row-spacer { flex: 1; }
  .row-price { font-weight: 650; }
  .badge { padding: 2px 9px; border-radius: 5px; font-size: 11px; font-weight: 650; white-space: nowrap; }
  .badge.paid { background: var(--ok-dim); color: var(--ok); }
  .badge.unpaid { background: var(--crit-dim); color: var(--crit); }

  .row-detail { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }

  .row-actions { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .note-input {
    flex: 1; min-width: 160px; font-family: inherit; font-size: 12.5px;
    padding: 5px 8px; border-radius: 5px; border: 1px solid var(--border); background: #fff; color: var(--text);
  }
  .note-save, a.admin-link {
    padding: 4px 9px; border-radius: 5px; border: none;
    background: var(--brand); color: #fff; font-size: 12.5px; font-weight: 650; cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  .note-save:hover, a.admin-link:hover { background: var(--brand-dark); }
  .note-status { font-size: 12px; color: var(--text-faint); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-faint); }
  footer { text-align: center; font-size: 11.5px; color: var(--text-faint); margin-top: 26px; }

  .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); }
  .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 32px 28px; width: 300px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
  .login-box img { height: 36px; margin-bottom: 14px; }
  .login-box h1 { font-size: 15px; margin: 0 0 18px; color: var(--text); }
  .login-box input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 7px; font-size: 14px; margin-bottom: 10px; }
  .login-box button { width: 100%; padding: 10px 12px; border: none; border-radius: 7px; background: var(--brand); color: #1a2e00; font-weight: 700; font-size: 14px; cursor: pointer; }
  .login-box button:hover { background: var(--brand-dark); color: #fff; }
  .login-box .login-error { color: var(--crit); font-size: 12.5px; margin-top: 10px; min-height: 15px; }
  .app-hidden { display: none !important; }
</style>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <img src="https://cdn.myshoptet.com/usr/www.okfish.sk/user/logos/logo-fish.png" alt="OKFISH">
    <h1>Prihlásenie do prehľadu objednávok</h1>
    <input type="password" id="loginPassword" placeholder="Heslo" autocomplete="current-password">
    <button id="loginSubmit">Prihlásiť sa</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div class="topbar app-hidden" id="appTopbar">
  <img src="https://cdn.myshoptet.com/usr/www.okfish.sk/user/logos/logo-fish.png" alt="OKFISH">
  <div class="title">Objednávky — prehľad<small>interný nástroj, nezdieľať</small></div>
</div>

<div class="wrap app-hidden" id="appWrap">
  <div class="summary-period">Prehľad za posledných 14 dní</div>
  <div class="summary" id="summary"></div>
  <div class="filters" id="filters"></div>
  <div class="list-header">
    <span class="lh-code">Objednávka</span>
    <span class="lh-customer">Zákazník</span>
    <span class="lh-date">Dátum</span>
    <span class="lh-spacer"></span>
    <span class="lh-status">Platba</span>
    <span class="lh-price">Cena</span>
  </div>
  <div id="content"><div class="empty-state">Načítám…</div></div>
  <footer>Aktualizuje sa každých 60 s</footer>
</div>

<script>
  // Heslo sa nikdy nenosí v URL -- po overení sa uloží do cookie (30 dní),
  // odkaz na stránku je tak čistý (bez ?token=...) a dá sa poslať kdekoľvek.
  function getCookie(name) {
    const m = document.cookie.match('(?:^|; )' + name + '=([^;]*)');
    return m ? decodeURIComponent(m[1]) : '';
  }
  function setCookie(name, value) {
    document.cookie = name + '=' + encodeURIComponent(value) + '; path=/; max-age=' + (60 * 60 * 24 * 30) + '; SameSite=Lax';
  }
  let TOKEN = getCookie('okfish_dash_token');
  let currentFilter = 'all'; // 'all', 'resolved'
  let lastData = null;

  async function tryLogin(password) {
    const errEl = document.getElementById('loginError');
    errEl.textContent = '';
    const res = await fetch('/v1/orders-status', { headers: { Authorization: 'Bearer ' + password }, cache: 'no-store' });
    if (!res.ok) { errEl.textContent = 'Nesprávne heslo, skús to znova.'; return; }
    TOKEN = password;
    setCookie('okfish_dash_token', password);
    document.getElementById('loginScreen').classList.add('app-hidden');
    document.getElementById('appTopbar').classList.remove('app-hidden');
    document.getElementById('appWrap').classList.remove('app-hidden');
    startApp();
  }

  document.getElementById('loginSubmit').addEventListener('click', () => {
    tryLogin(document.getElementById('loginPassword').value);
  });
  document.getElementById('loginPassword').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') tryLogin(document.getElementById('loginPassword').value);
  });

  if (TOKEN) {
    // Cookie už existuje -- rovno skúsime overiť a preskočiť prihlasovaciu obrazovku.
    tryLogin(TOKEN);
  }

  function fmtMoney(v) {
    return new Intl.NumberFormat('sk-SK', { style: 'currency', currency: 'EUR' }).format(Number(v) || 0);
  }
  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('sk-SK') + ' ' + d.toLocaleTimeString('sk-SK', { hour: '2-digit', minute: '2-digit' });
  }
  function renderSummary(orders) {
    const activeCount = orders.filter(o => !o.resolved).length;
    const unpaidCount = orders.filter(o => !o.resolved && !o.paid).length;
    const summary = document.getElementById('summary');
    summary.innerHTML =
      '<div class="sum-card"><div class="num mono">' + activeCount + '</div><div class="lbl">aktívnych objednávok</div></div>' +
      '<div class="sum-card"><div class="num mono">' + unpaidCount + '</div><div class="lbl">nezaplatených</div></div>';
  }

  function renderFilters(orders) {
    const activeCount = orders.filter(o => !o.resolved).length;
    const resolvedCount = orders.filter(o => o.resolved).length;
    const opts = [
      ['all', 'Aktívne (' + activeCount + ')'],
      ['resolved', 'Vyriešené (' + resolvedCount + ')'],
    ];
    const filters = document.getElementById('filters');
    filters.innerHTML = opts.map(([key, label]) =>
      '<button class="filter-btn' + (currentFilter === key ? ' active' : '') + '" data-filter="' + key + '">' + label + '</button>'
    ).join('');
  }

  function render(data) {
    lastData = data;
    const content = document.getElementById('content');
    const draftNotes = {};
    content.querySelectorAll('.note-input').forEach((el) => {
      if (el.value) draftNotes[el.dataset.code] = el.value;
    });

    const orders = data.orders || [];
    renderSummary(orders);
    renderFilters(orders);

    if (orders.length === 0) {
      content.innerHTML = '<div class="empty-state">Žiadne otvorené objednávky za posledných 14 dní.</div>';
      return;
    }

    orders.sort((a, b) => new Date(b.creationTime).getTime() - new Date(a.creationTime).getTime());

    const filtered = orders.filter(o => {
      if (currentFilter === 'resolved') return !!o.resolved;
      if (o.resolved) return false; // vyriešené sa mimo záložky "Vyriešené" neukazujú
      return true; // currentFilter === 'all'
    });

    if (filtered.length === 0) {
      content.innerHTML = '<div class="empty-state">✓ Nič v tejto kategórii — dobrá práca!</div>';
      return;
    }

    let html = '<div class="list">';
    for (const o of filtered) {
      html += '<div class="order-row' + (o.resolved ? ' is-resolved' : '') + '" data-code="' + o.code + '">';
      html += '<div class="row-top">';
      html += '<span class="row-code mono">' + o.code + '</span>';
      html += '<span class="row-customer">' + o.customerName + '</span>';
      html += '<span class="row-date mono">' + fmtDate(o.creationTime) + '</span>';
      html += '<span class="row-spacer"></span>';
      if (o.resolved) html += '<span class="resolve-badge">✓ VYRIEŠENÉ</span>';
      html += '<span class="badge ' + (o.paid ? 'paid' : 'unpaid') + '">' + (o.paid ? 'Zaplatené' : 'Nezaplatené') + '</span>';
      html += '<span class="row-price mono">' + fmtMoney(o.priceWithVat) + '</span>';
      html += '</div>';

      html += '<div class="row-detail">';
      html += '<div class="row-actions">';
      html += '<textarea class="note-input" rows="1" data-code="' + o.code + '" placeholder="Poznámka e-shopu…"></textarea>';
      html += '<button class="note-save" data-code="' + o.code + '">Uložiť poznámku</button>';
      html += '<span class="note-status" data-code="' + o.code + '"></span>';
      html += '<button class="resolve-toggle" data-code="' + o.code + '" data-resolved="' + (o.resolved ? '1' : '0') + '">' + (o.resolved ? '↺ Vrátiť medzi aktívne' : '✓ Označiť ako vyriešené') + '</button>';
      html += '<a class="admin-link" href="' + o.adminUrl + '" target="_blank">Otvoriť →</a>';
      html += '</div>';
      html += '</div>'; // row-detail
      html += '</div>'; // order-row
    }
    html += '</div>';
    content.innerHTML = html;
    content.querySelectorAll('.note-input').forEach((el) => {
      if (draftNotes[el.dataset.code]) el.value = draftNotes[el.dataset.code];
    });
  }

  document.getElementById('filters').addEventListener('click', (e) => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    currentFilter = btn.dataset.filter;
    if (lastData) render(lastData);
  });

  document.getElementById('content').addEventListener('click', async (e) => {
    if (e.target.classList.contains('resolve-toggle')) {
      const code = e.target.dataset.code;
      const newResolved = e.target.dataset.resolved !== '1';
      e.target.disabled = true;
      try {
        await fetch('/v1/order-resolved?token=' + encodeURIComponent(TOKEN), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, resolved: newResolved }),
        });
        await poll(); // okamžite prekresliť podľa nového stavu
      } catch (err) {
        e.target.disabled = false;
      }
      return;
    }

    if (!e.target.classList.contains('note-save')) return;
    const code = e.target.dataset.code;
    const textarea = document.querySelector('.note-input[data-code="' + code + '"]');
    const status = document.querySelector('.note-status[data-code="' + code + '"]');
    const note = textarea.value;
    e.target.disabled = true;
    status.textContent = 'ukladám…';
    try {
      const res = await fetch('/v1/order-note?token=' + encodeURIComponent(TOKEN), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, note }),
      });
      const data = await res.json();
      status.textContent = res.ok ? '✓ uložené' : ('chyba: ' + (data.error || res.status));
    } catch (err) {
      status.textContent = 'chyba spojenia';
    }
    e.target.disabled = false;
  });

  async function poll() {
    try {
      const res = await fetch('/v1/orders-status', { headers: { Authorization: 'Bearer ' + TOKEN }, cache: 'no-store' });
      const data = await res.json();
      render(data);
    } catch (e) {
      document.getElementById('content').innerHTML = '<div class="empty-state">Chyba spojenia.</div>';
    }
  }

  let appStarted = false;
  function startApp() {
    if (appStarted) return; // po prihlásení sa nesmie nabehnúť dvakrát
    appStarted = true;
    poll();
    setInterval(poll, 60000);
  }
</script>
