name: Find flat-brand products missing action price

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - working-directory: cloudflare-worker
        run: npm ci
      - working-directory: cloudflare-worker
        env:
          MASTER_FEED_URL: ${{ secrets.MASTER_FEED_URL }}
        run: npx tsx src/cli/find-flat-brand-missing-action.ts
      - uses: actions/upload-artifact@v4
        with:
          name: flat_brand_missing_action
          path: flat_brand_missing_action.csv
          retention-days: 7
