                            e.target.querySelector(".shp_footer-try-us-form-email").focus();
                        }
                    });
                }
                /* !TRY US FORM */

                function emailIsValid(email) {
                    var emailRegEx = /^(([^<>()[\]\\.,;:\s@\"]+(\.[^<>()[\]\\.,;:\s@\"]+)*)|(\".+\"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
