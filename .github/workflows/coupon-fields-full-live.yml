name: Coupon fields FULL live write (one-off)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - working-directory: cloudflare-worker
        run: npm ci
      - name: Full live write (bypasses diff-aware state file)
        working-directory: cloudflare-worker
        env:
          MASTER_FEED_URL: ${{ secrets.MASTER_FEED_URL }}
          SHOPTET_PRIVATE_API_TOKEN: ${{ secrets.SHOPTET_PRIVATE_API_TOKEN }}
        run: npx tsx src/cli/sync-coupon-fields-live.ts
