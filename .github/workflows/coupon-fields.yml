name: Coupon Fields Sync (2x denně)

on:
  schedule:
    # 06:00 a 18:00 UTC, dvakrát denně. Běží nezávisle na hlavní cenové
    # synchronizaci (sync.yml) — jiné pole (sales.discountCoupon/minPriceRatio),
    # jiný zápis, žádné sdílené kroky.
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Možnost manuálního spuštění přes UI

concurrency:
  group: coupon-fields-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Práva pro commitnutí aktualizovaného coupon-state.json zpět do repozitáře.
    permissions:
      contents: write

    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Příprava Node.js prostředí
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalace závislostí (root)
        run: npm ci

      - name: Instalace závislostí (cloudflare-worker)
        working-directory: cloudflare-worker
        run: npm ci

      - name: Diff-aware zápis coupon fields (jen změny)
        id: sync_run
        working-directory: cloudflare-worker
        env:
          MASTER_FEED_URL: ${{ secrets.MASTER_FEED_URL }}
          SHOPTET_PRIVATE_API_TOKEN: ${{ secrets.SHOPTET_PRIVATE_API_TOKEN }}
        run: |
          set -o pipefail
          npm run sync-coupon-fields-diff-live | tee coupon-sync.log

      - name: Uložení coupon-state.json do repozitáře
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: aktualizace coupon-state.json [skip ci]"
          file_pattern: cloudflare-worker/coupon-state.json

      - name: Uložení logu v případě chyby
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coupon-sync-error-log
          path: cloudflare-worker/coupon-sync.log
          retention-days: 7
